name: Coretemp Sentinel

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Ayni anda iki kosu state dosyasini ezmesin
concurrency:
  group: sentinel-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repoyu cek
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sentinel taramasi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SENTINEL_DB: sentinel.db
        run: python3 sentinel.py

      - name: Gorulen kayit state'ini commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sentinel.db
          if git diff --cached --quiet; then
            echo "State degismedi, commit yok."
            exit 0
          fi
          git commit -m "chore: update seen state [skip ci]"
          # Arada baska bir kosu push ettiyse rebase ile uzerine yaz
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
