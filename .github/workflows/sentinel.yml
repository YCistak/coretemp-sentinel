name: Coretemp Sentinel

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Ayni anda iki kosu state dosyasini ezmesin
concurrency:
  group: sentinel-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repoyu cek
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sentinel taramasi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SENTINEL_DB: sentinel.db
          # git.kernel.org Atom beslemesi cokerse GitHub API'ye dusulur;
          # token yalnizca istek basliginda kullanilir, hicbir dosyaya yazilmaz.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 sentinel.py

      - name: Gorulen kayit state'ini commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sentinel.db
          if git diff --cached --quiet; then
            echo "State degismedi, commit yok."
            exit 0
          fi
          git commit -m "chore: update seen state [skip ci]"
          # Arada baska biri push ettiyse rebase ile uzerine yaz. sentinel.db ikili
          # dosya oldugundan cakismada bizim (guncel) kopya kazanir (-X theirs:
          # rebase sirasinda "theirs" = bizim commit). Eskiden "|| true" hatayi
          # yutuyor, yarim kalan rebase push'u sessizce dusuruyordu; bildirimler
          # gittigi icin state kaybi ayni kayitlarin tekrar gonderilmesine yol acar.
          for deneme in 1 2 3; do
            if git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push basarisiz (deneme ${deneme}/3), yeniden deneniyor."
            git rebase --abort 2>/dev/null || true
            sleep $((deneme * 5))
          done
          echo "State push edilemedi." >&2
          exit 1
